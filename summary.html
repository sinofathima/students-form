<!DOCTYPE html>
<html>
<head>
<title>Summary</title>
</head>
<body>

<h3>Student Details Summary</h3>
<div id="result"></div>
<br>
<button onclick="window.location.href='index.html'">Back to Form</button>

<script>
var d = JSON.parse(localStorage.getItem('student'));
if(d){
 document.getElementById('result').innerHTML =
 'Name: ' + d.name + '<br><br>' +
 'Gender: ' + d.gender + '<br><br>' +
 'Course: ' + d.course + '<br><br>' +
 'ML - Marks: ' + d.ml + ' Grade: ' + d.mlg + '<br>' +
 'CN - Marks: ' + d.cn + ' Grade: ' + d.cng + '<br>' +
 'EA - Marks: ' + d.ea + ' Grade: ' + d.eag + '<br><br>' +
 'Average: ' + d.avg;
} else {
 document.getElementById('result').innerHTML = 'No Data';
}
</script>

</body>
</html>
